[build]
publish = "."
command = "echo 'Static site - no build needed'"

# Exclude specific HTML files from SPA redirect (must be BEFORE catch-all)
[[redirects]]
from = "/self-worth-aktivierung.html"
to = "/self-worth-aktivierung.html"
status = 200

# Catch-all for SPA (AFTER specific routes)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[context.production]
environment = { NODE_ENV = "production" }

[context.deploy-preview]
environment = { NODE_ENV = "development" }

[context.branch-deploy]
environment = { NODE_ENV = "development" }
